# Stage-1 runtime environment (conda / miniforge).
#
# Verified platform:
#   WSL2 | Ubuntu 24.04 | NVIDIA RTX 4070 SUPER | CUDA driver 12.0
#   Python 3.11.14 | PyTorch 2.6.0+cu124 | Stable-Baselines3 2.7.0 | airsim 1.7.0
#
# The simulator, the data-exchange hub and the trainer all ran inside the same
# WSL2 instance. Install with:
#
#     conda env create -f environment.yml
#     conda activate airsim-gym-ubuntu2404
#
# Note: sb3-contrib is present in the original environment; it supplies
# RecurrentPPO, which is where the historical "RecurrentPPO_SB3_AirSim.py"
# filenames came from. The published policy itself is a plain feed-forward PPO.
#
# `prefix:` from the original export is dropped on purpose (machine-specific).
# See docs/REPRODUCING.md for the simulator build and the IP configuration.
